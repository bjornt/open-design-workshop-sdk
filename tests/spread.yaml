project: open-design

path: /home/ubuntu/project

backends:
  lxd:
    systems:
      # 24.04 only: better-sqlite3 and sharp are compiled from source against
      # the build-base (ubuntu@24.04) glibc, so the runtime base must match.
      - ubuntu-24.04:
          username: ubuntu
          vm: true

suites:
  main/:
    summary: Test the open-design SDK inside a workshop
    environment:
      BASE/noble: ubuntu@24.04
      EXPECTED_VERSION: '$(HOST: cat "`git rev-parse --show-toplevel`/VERSION")'
